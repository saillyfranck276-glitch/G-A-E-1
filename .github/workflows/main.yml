name: Build Flet APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation de Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Purge absolue du cache de build
        run: |
          flet clean || true
          rm -rf build /tmp/flet_*

      - name: Compilation APK
        run: |
          flet build apk --verbose

      - name: Telechargement de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/apk/*.apk
