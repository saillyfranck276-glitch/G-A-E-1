name: Build G-A-E APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          sudo apt-get clean

      - name: Configurer Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configuration de Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          cache: true

      - name: Dépendances système Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake swig pkg-config libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libwebp-dev libgtk-3-dev ninja-build

      - name: Acceptation des licences Android SDK
        run: |
          flutter config --no-analytics
          yes | flutter doctor --android-licenses || true

      - name: Convertir automatiquement Flet 0.21.2 et remplacer Pillow/ReportLab
        run: |
          # Passage à Flet 0.24.1
          if [ -f "requirements.txt" ]; then sed -i 's/flet==0.21.2/flet==0.24.1/g' requirements.txt; fi
          if [ -f "pyproject.toml" ]; then sed -i 's/flet==0.21.2/flet==0.24.1/g' pyproject.toml; fi
          if [ -f "pyproject.toml" ]; then sed -i 's/flet>=0.21.2/flet==0.24.1/g' pyproject.toml; fi

          # Remplacement automatique de reportlab/fpdf2 par fpdf 1.7.2 (sans Pillow)
          if [ -f "requirements.txt" ]; then sed -i 's/reportlab/fpdf==1.7.2/g' requirements.txt; fi
          if [ -f "requirements.txt" ]; then sed -i 's/fpdf2/fpdf==1.7.2/g' requirements.txt; fi
          if [ -f "requirements.txt" ]; then sed -i '/pillow/d' requirements.txt; fi

      - name: Installation des dépendances Python
        run: |
          rm -rf PIL
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade "flet==0.24.1" "fpdf==1.7.2" pypdf
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          if [ -f "setup.py" ] || [ -f "pyproject.toml" ]; then pip install -e . || pip install .; fi

      - name: Générer l'APK Android
        env:
          CI: "true"
          FLUTTER_SUPPRESS_ANALYTICS: "true"
          PUB_DISABLE_ANALYTICS: "true"
        run: |
          yes | flet build apk --verbose

      - name: Sauvegarder l'APK en artifact GitHub
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: GAEApp-Android
          path: build/apk/*.apk

      - name: Obtenir un lien de téléchargement direct
        if: always()
        run: |
          APK_FILE=$(find build/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            echo "=========================================================="
            echo " FICHIER APK DÉTECTÉ : $APK_FILE"
            echo "=========================================================="
            echo "--> LIEN 1 (BashUpload) :"
            curl -T "$APK_FILE" https://bashupload.com/ || true
            echo ""
            echo "--> LIEN 2 (Litterbox) :"
            curl -F "reqtype=fileupload" -F "time=24h" -F "fileToUpload=@$APK_FILE" https://litterbox.catbox.moe/resources/internals/api.php || true
          else
            echo "Aucun fichier APK n'a été trouvé."
          fi
