name: Build G-A-E APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          sudo apt-get clean

      - name: Configurer Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configuration de Flutter 3.24.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          cache: true

      - name: Configuration Android SDK et Licences
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
          flutter config --android-sdk "$ANDROID_HOME"
          flutter config --no-analytics
          yes | flutter doctor --android-licenses || true

      - name: Installation des dépendances Python
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Nettoyer le cache Flet et supprimer les faux modules
        run: |
          rm -rf PIL build /tmp/flet_*
          flet clean || true

      - name: Générer l'APK Android
        env:
          CI: "true"
          FLUTTER_SUPPRESS_ANALYTICS: "true"
          PUB_DISABLE_ANALYTICS: "true"
        run: |
          yes | flet build apk --verbose

      - name: Sauvegarder l'APK en artifact GitHub
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: GAEApp-Android
          path: build/apk/*.apk

      - name: Obtenir un lien de téléchargement direct
        if: always()
        run: |
          APK_FILE=$(find build/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            echo "=========================================================="
            echo " FICHIER APK DÉTECTÉ : $APK_FILE"
            echo "=========================================================="
            echo "--> LIEN 1 (BashUpload) :"
            curl -T "$APK_FILE" https://bashupload.com/ || true
            echo ""
            echo "--> LIEN 2 (Litterbox) :"
            curl -F "reqtype=fileupload" -F "time=24h" -F "fileToUpload=@$APK_FILE" https://litterbox.catbox.moe/resources/internals/api.php || true
          else
            echo "Aucun fichier APK n'a été trouvé."
          fi
