name: Build G-A-E APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances Python
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Purge du cache de build
        run: |
          flet clean || true
          rm -rf build /tmp/flet_*

      - name: Générer l'APK Android
        env:
          CI: "true"
          FLUTTER_SUPPRESS_ANALYTICS: "true"
          PUB_DISABLE_ANALYTICS: "true"
        run: |
          yes | flet build apk --verbose

      - name: Sauvegarder l'APK en artifact GitHub
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: GAEApp-Android
          path: build/apk/*.apk

      - name: Obtenir un lien de téléchargement direct
        if: always()
        run: |
          APK_FILE=$(find build/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            echo "=========================================================="
            echo " FICHIER APK DÉTECTÉ : $APK_FILE"
            echo "=========================================================="
            echo "--> LIEN 1 (BashUpload) :"
            curl -T "$APK_FILE" https://bashupload.com/ || true
            echo ""
            echo "--> LIEN 2 (Litterbox) :"
            curl -F "reqtype=fileupload" -F "time=24h" -F "fileToUpload=@$APK_FILE" https://litterbox.catbox.moe/resources/internals/api.php || true
          else
            echo "Aucun fichier APK n'a été trouvé."
          fi
