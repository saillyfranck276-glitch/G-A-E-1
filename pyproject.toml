[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "G-A-E"
version = "0.1.0"
description = "Application de gestion pour micro-entreprise / auto-entrepreneur développée avec Flet."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Francky" }
]

dependencies = [
    "flet==0.24.1",
    "fpdf2==2.7.8",
    "pypdf==4.0.1",
    "google-api-python-client==2.118.0",
    "google-auth-httplib2==0.2.0",
    "google-auth-oauthlib==1.2.0",
    "google-api-core==2.17.1",
    "google-auth==2.28.1",
    "googleapis-common-protos==1.62.0",
    "httplib2==0.22.0",
    "protobuf==4.25.3",
    "urllib3==2.2.1",
    "requests==2.31.0",
    "idna==3.6",
    "charset-normalizer==3.3.2",
    "certifi==2024.2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
