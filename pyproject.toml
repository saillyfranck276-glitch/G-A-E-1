[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "G-A-E"
version = "0.1.0"
description = "Application de gestion pour micro-entreprise / auto-entrepreneur développée avec Flet."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Francky" }
]

dependencies = [
    "flet==0.21.2",
    "reportlab==4.1.0",
    "google-api-python-client==2.118.0",
    "google-auth-httplib2==0.2.0",
    "google-auth-oauthlib==1.2.0",
    "pypdf==4.0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
